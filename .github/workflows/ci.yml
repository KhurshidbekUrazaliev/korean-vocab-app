name: Course CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: course-ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Install Chromium for accessibility checks
        run: npx playwright install --with-deps chromium
      - name: Check the production site with axe
        run: npm run test:a11y
      - name: Save accessibility findings
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: accessibility-findings
          path: e2e/results/
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'push'
        with:
          name: course-dist
          path: dist/
          include-hidden-files: true
          if-no-files-found: error

  publish:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write
    steps:
      - uses: actions/checkout@v4
        with:
          path: release-tools
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: site
      - uses: actions/download-artifact@v4
        with:
          name: course-dist
          path: ${{ runner.temp }}/course-dist
      - name: Publish tested files and request a Pages build
        working-directory: site
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          remote_main=$(git ls-remote --exit-code --refs origin refs/heads/main)
          read -r main_sha main_ref <<< "$remote_main"
          if [[ ! "$main_sha" =~ ^[0-9a-f]{40}$ || "$main_ref" != refs/heads/main ]]; then
            echo "::error::Could not determine the current main revision."
            exit 1
          fi
          if [[ "$main_sha" != "$GITHUB_SHA" ]]; then
            echo "A newer main revision is queued for publication."
            exit 0
          fi
          test -s "$RUNNER_TEMP/course-dist/index.html"
          test -f "$RUNNER_TEMP/course-dist/.nojekyll"
          rsync -a --delete --exclude='.git/' --exclude='CNAME' "$RUNNER_TEMP/course-dist/" ./
          node "$GITHUB_WORKSPACE/release-tools/.github/retain-pages-assets.cjs"
          git add -A
          if ! git diff --cached --quiet; then
            git -c user.name=github-actions -c user.email=41898282+github-actions[bot]@users.noreply.github.com commit -m "Publish ${GITHUB_SHA}"
            git push origin HEAD:gh-pages
          fi
          gh api --method POST "repos/$GITHUB_REPOSITORY/pages/builds" --silent
